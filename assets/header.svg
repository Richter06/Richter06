    <stop stop-color="#9B6F08"/>
    <stop offset=".5" stop-color="#DDBB55"/>
    <stop offset="1" stop-color="#9B6F08"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#80600E" flood-opacity=".12"/>
  </filter>
</defs>

<!-- clean ivory card -->
<rect x="8" y="8" width="1184" height="344" rx="28" fill="#FFFDF8" stroke="url(#gold)" stroke-width="4"/>
<rect x="22" y="22" width="1156" height="316" rx="20" stroke="#E7CA72" stroke-width="1.5"/>

